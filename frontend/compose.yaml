services:
  # ── Frontend (React + Nginx)
  frontend:
    build: ./frontend
    container_name: clinic_frontend
    ports:
      - "5173:80" # Browser http://localhost:5173
    depends_on:
      - api
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  api:
    build: ./backend
    container_name: clinic_api
    ports:
      - "8000:8000" # frontend  http://localhost:8000
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic_user:clinic123@db:5432/clinic_db
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: clinic_db
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic123
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
